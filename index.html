  <script>
    (function () {
      var screen = document.getElementById("startup-screen");
      var message = document.getElementById("startup-message");
      var retry = document.getElementById("startup-retry");
      function showError(text) {
        if (!screen.isConnected) return;
        screen.dataset.state = "error";
        message.textContent = text;
        retry.hidden = false;
      }
      function offline() { showError("Нет соединения с интернетом. Подключитесь к сети и обновите страницу."); }
      function online() {
        if (screen.dataset.state === "error") showError("Сеть доступна. Попробуйте обновить страницу.");
      }
      function failed(event) {
        if (event.target && event.target.hasAttribute && event.target.hasAttribute("data-app-entry")) {
          showError("Не удалось загрузить сайт. Проверьте соединение и обновите страницу.");
        }
      }
      function reload() { window.location.reload(); }
      retry.addEventListener("click", reload);
      window.addEventListener("offline", offline);
      window.addEventListener("online", online);
      window.addEventListener("error", failed, true);
      var timer = setTimeout(function () {
        showError("Загрузка занимает больше времени, чем обычно. Проверьте соединение или обновите страницу.");
      }, 15000);
      // React replaces this fallback on its first render. No artificial delay.
      var observer = new MutationObserver(function () {
        if (screen.isConnected) return;
        clearTimeout(timer);
        retry.removeEventListener("click", reload);
        window.removeEventListener("offline", offline);
        window.removeEventListener("online", online);
        window.removeEventListener("error", failed, true);
        observer.disconnect();
      });
      observer.observe(document.getElementById("root"), { childList: true });
      if (!navigator.onLine) offline();
    })();
  </script>
